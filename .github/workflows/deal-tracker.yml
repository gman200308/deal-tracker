name: Deal tracker

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour (GitHub may delay runs)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 60-minute minimum poll interval"
        type: boolean
        default: false

permissions:
  contents: write   # commit state/seen.json back
  pages: write      # deploy the dashboard
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: deal-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployable: ${{ steps.package.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # deals.json isn't committed (it's ~1.5 MB and changes hourly). Start from the live
      # copy so a store that fails this run keeps showing its last good data.
      - name: Restore previous dashboard data
        run: |
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deals.json" \
            -o docs/deals.json || echo "No previous deals.json (first deploy?)"

      - name: Poll stores and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # optional, only for protected topics
        run: python deal_tracker.py ${{ inputs.force && '--force' || '' }}

      - name: Commit state
        if: always() && hashFiles('state/seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update deals [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Package dashboard
        id: package
        if: always() && hashFiles('docs/deals.json') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: poll
    if: always() && needs.poll.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
