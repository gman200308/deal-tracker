name: Deal tracker

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour (GitHub may delay runs)
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 60-minute minimum poll interval"
        type: boolean
        default: false

permissions:
  contents: write   # commit state/seen.json and docs/deals.json back
  pages: write      # deploy the dashboard
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: deal-tracker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll stores and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # optional, only for protected topics
        run: python deal_tracker.py ${{ inputs.force && '--force' || '' }}

      - name: Commit state and dashboard data
        if: always() && hashFiles('state/seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json docs/deals.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update deals [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Package dashboard
        if: always() && hashFiles('docs/deals.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: poll
    if: always() && needs.poll.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
